name: Keep Render and Neon warm during judging

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-neon-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the Render API
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 90 \
            https://adchan.onrender.com/health

      - name: Run the synthetic read-only warm-up
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 20 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://adchan-web.vercel.app/api/cron/keep-neon-warm
